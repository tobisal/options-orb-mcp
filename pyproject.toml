[project]
name = "options-orb-mcp"
version = "0.1.0"
description = "Demo-first MCP system for defined-risk options trading driven by an Opening Range Breakout signal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "ib-async>=1.0.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "starlette>=0.37",
    "discord.py>=2.4",
    "certifi>=2024.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
orb-setup = "scripts.setup:main"
orb-dashboard = "dashboard.app:main"
orb-discord = "scripts.discord_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "servers", "scripts", "dashboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines; B905: zip(strict=) is pedantic here; UP042: we use (str, Enum)
# intentionally for broad compatibility rather than enum.StrEnum.
ignore = ["E501", "B905", "UP042"]
