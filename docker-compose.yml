# Full stack: IB Gateway + dashboard (+ optional Discord bot).
#
#   1. Copy .env.example to .env and set IB_GATEWAY_USER / IB_GATEWAY_PASSWORD
#      (paper credentials; keep them out of git).
#   2. Optional: set VNC_SERVER_PASSWORD in .env to debug Gateway via VNC
#      (SSH tunnel: ssh -L 5900:127.0.0.1:5900 user@host → VNC to 127.0.0.1:5900).
#   3. docker compose up -d --build
#   4. Dashboard via SSH tunnel: http://127.0.0.1:8787
#   5. Optional Discord: docker compose --profile discord up -d
#
# Dashboard shares ib-gateway's network so it can use Gateway's paper API at
# 127.0.0.1:4002 (localhost-only). Host 127.0.0.1:4002 still maps to socat 4004
# for processes on the EC2 host. Dashboard HTTP is published on the gateway
# container as 127.0.0.1:8787.

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: orb-ib-gateway
    restart: unless-stopped
    environment:
      TWS_USERID: ${IB_GATEWAY_USER}
      TWS_PASSWORD: ${IB_GATEWAY_PASSWORD}
      TRADING_MODE: paper            # paper | live
      READ_ONLY_API: "no"            # "yes" to forbid order placement entirely
      TWS_ACCEPT_INCOMING: accept
      TIME_ZONE: Europe/London
      TZ: Europe/London
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: "9:00 PM"
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      # primaryoverride: take over if Windows TWS/Gateway still holds the paper session
      EXISTING_SESSION_DETECTED_ACTION: primaryoverride
      JAVA_HEAP_SIZE: "768"
      # Set in .env to enable VNC (leave empty to disable).
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:4002:4004"        # paper API for the host (socat → Gateway 4002)
      - "127.0.0.1:4001:4003"        # live API
      - "127.0.0.1:8787:8787"        # dashboard (shared network namespace)
      - "127.0.0.1:5900:5900"        # VNC (only active if VNC_SERVER_PASSWORD set)
    volumes:
      - ib-settings:/home/ibgateway/tws_settings

  dashboard:
    build: .
    image: options-orb-mcp:latest
    container_name: orb-dashboard
    restart: unless-stopped
    network_mode: "service:ib-gateway"
    env_file:
      - .env
    environment:
      # Must be localhost: Gateway only completes the API handshake on 127.0.0.1.
      IBKR_HOST: 127.0.0.1
      IBKR_PORT: "4002"
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8787"
      DISCORD_DASHBOARD_URL: http://127.0.0.1:8787
      DB_PATH: data/trades.db
    volumes:
      # Bind-mount so a copied trades.db + history/*.csv are visible.
      - ./data:/app/data
    depends_on:
      - ib-gateway
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  discord:
    build: .
    image: options-orb-mcp:latest
    container_name: orb-discord
    restart: unless-stopped
    profiles: ["discord"]
    env_file:
      - .env
    environment:
      # Reach dashboard via the gateway service name (shared published port).
      DISCORD_DASHBOARD_URL: http://ib-gateway:8787
    command: ["discord"]
    depends_on:
      dashboard:
        condition: service_healthy

volumes:
  ib-settings:
